<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Myy ja Opi</title>
  <link href="/src/style.css" rel="stylesheet">
</head>

<body>

  <header class="
  flex flex-wrap justify-between items-center gap-8
  sticky top-0 z-10
  p-3
  text-white bg-blue-700 shadow-lg shadow-blue-950/25
  ">

    <div class="flex items-center" id="website-title">
      Myy ja Opi
    </div>

    <nav class="flex flex-wrap items-center gap-2">

      <button>Myy</button>
      <button>Ilmoitukset</button>
      <button>Viestit</button>

      <button class="
      flex items-center gap-2
      user-nav
      rounded-full
      ">
        <img class="rounded-full" id="user-avatar" alt="User avatar" src="images/user-svgrepo-com.svg">
        <span id="user-name">Anonyymi</span>
      </button>

    </nav>

  </header>

  <main>

    <form id="search-form">

      <label for="item-search">
        <h2>Etsi</h2>
      </label>

      <div>
        <input type="search" class="search-bar" id="item-search" name="item-search" placeholder="Etsi tuotteita...">
        <input type="submit" class="search-button" value="Hae">
      </div>

      <label for="search-filters">
        <h3>Kategoriat</h3>
      </label>

      <div class="checkbox-group">

        <input type="checkbox" id="books" name="search-filters" value="books"><label for="books">Kirjat</label>
        <input type="checkbox" id="clothes" name="search-filters" value="clothes"><label for="clothes">Vaatteet</label>
        <input type="checkbox" id="electronics" name="search-filters" value="electronics"><label
          for="electronics">Elektroniikka</label>
        <input type="checkbox" id="badges" name="search-filters" value="badges"><label
          for="badges">Haalarimerkit</label>

      </div>
    </form>

    <section>

      <h2>Suosituimmat tuotteet</h2>

      <div class="product-row">

        <div class="product-card">
          <img src="images/product.png" alt="" aria-hidden="true" class="product-img">
          <span class="product-name">Tuote 1</span>
        </div>

        <div class="product-card">
          <img src="images/product.png" alt="" aria-hidden="true" class="product-img">
          <span class="product-name">Tuote 2</span>
        </div>

        <div class="product-card">
          <img src="images/product.png" alt="" aria-hidden="true" class="product-img">
          <span class="product-name">Tuote 3</span>
        </div>

      </div>

    </section>

  </main>


</body>

</html>
