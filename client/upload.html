<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Myy ja Opi</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" type="text/css" href="src/style.css">
</head>

<body class="w-full flex flex-col items-center">

  <header class="
    flex flex-wrap justify-between items-center gap-8
    sticky top-0 z-10
    w-full
    p-3
    text-white bg-blue-600 shadow-lg shadow-black-950/25
    ">

    <a class="flex items-center" id="website-title" href="index.html">
      <img src="images/myy-ja-opi-logo.png" alt="Myy ja Opi" class="h-10 w-auto md:h-12">
    </a>

    <nav id="top-navi" class="flex flex-wrap items-center gap-2">

      <button class="flex flex-row items-center gap-2
      rounded-full bg-orange-400 text-purple-950 p-3
      hover:bg-orange-300
      active:bg-orange-500"><i class="fa-solid fa-sack-dollar"></i><span class="nav-label">Myy</span></button>
      <button class="flex flex-row items-center gap-2
      rounded-full bg-transparent text-white p-3
      hover:bg-blue-500
      active:bg-blue-700"><i class="fa-solid fa-cart-shopping"></i><span class="nav-label">Ostoskori</span></button>
      <button class="flex flex-row items-center gap-2
      rounded-full bg-transparent text-white p-3
      hover:bg-blue-500
      active:bg-blue-700"><i class="fa-solid fa-bell"></i><span class="nav-label">Ilmoitukset</span></button>

      <button class="
      flex items-center gap-2
      rounded-full bg-transparent text-white p-2
      border border-white/20
      hover:bg-blue-500
      active:bg-blue-700
      ">
        <img class="rounded-full size-10 p-2" id="user-avatar" alt="User avatar" src="../images/user-svgrepo-com.svg">
        <span id="user-name" class="nav-label">Anonyymi</span>
      </button>

    </nav>

  </header>

  <form class="w-[92%] max-w-6xl mx-auto px-2 py-6 flex flex-col items-center gap-8 lg:flex-row lg:items-start">
    <!-- content here -->
    <div class="flex flex-col w-[80%] gap-2 sm:w-[50%] lg:h-[75vh]">

      <label for="title" class="text-2xl font-bold my-2">Otsikko</label>
      <input type="text" id="title" name="title" class=" border-[2px] border-solid border-grey-400 p-2"
        placeholder="Tavaran nimi">

      <label for="image" class="text-2xl font-bold my-2">Kuva</label>
      <input type="file" id="image" name="image" class="bg-blue-600 p-3 rounded-2xl text-white"
        accept="image/png, image/jpeg">
      <img src="images/placeholder.jpg" id="product-big-img" class="w-full">
      <!-- ladattu kuva voisi ilmestyä tuohon img-elementtiin? -->
    </div>
    <section class="gap-4 w-[92%] lg:w-[50vw] flex flex-col">
      <label for="price" class="text-2xl font-bold my-2">Hinta</label>
      <input id="price" name="price" type="number" placeholder="Anna hinta" min="1"
        class="border-[2px] border-solid border-grey-400 p-2">

      <label for="description" class="text-2xl font-bold my-2">Kuvaus</label>
      <input id="description" name="description" type="text" placeholder="Anna tuotteelle kuvaus..."
        class="border-[2px] border-solid border-grey-400 p-2">

      <h2 class="text-2xl font-bold my-2">Lisätietoa</h2>
      <div>
        <label for="condition" class="font-bold text-xl">Kunto:</label>
        <div class="flex flex-col gap-2 lg:flex-row">
          <div>
            <input type="radio" id="1" name="condition"><label for="1">Uusi</label>
          </div>
          <div>
            <input type="radio" id="2" name="condition"><label for="2">Erinomainen</label>
          </div>
          <div>
            <input type="radio" id="3" name="condition"><label for="3">Hyvä</label>
          </div>
          <div>
            <input type="radio" id="4" name="condition"><label for="4">Kohtalainen</label>
          </div>
          <div>
            <input type="radio" id="5" name="condition"><label for="5">Huono</label>
          </div>
        </div>

        <label for="category" class="font-bold text-xl">Kategoria:</label>
        <select name="category" id="category">
          <option value="electronics">
            Elektroniikka
          </option>
          <option value="clothes">
            Vaatteet
          </option>
          <option value="books">
            Kirjat
          </option>
          <option value="badges">
            Haalarimerkit
          </option>
        </select>
        <br>
        <label for="location" class="font-bold text-xl">Sijainti:</label>
      </div>

      <input type="submit" class="bg-blue-600 p-3 rounded-2xl text-white" value="Aseta myyntiin">
  </form>

  <nav
    class="mobile-only fixed inset-x-4 bottom-4 z-20 rounded-full border border-white/50 bg-white/40 px-3 shadow-lg shadow-black/10 backdrop-blur-xl backdrop-saturate-150">
    <ul class="flex h-16 items-center justify-around">

      <li>
        <a href="index.html" class="flex flex-col items-center gap-1 text-[11px] font-medium text-blue-600">
          <i class="fa-solid fa-house text-xl"></i>
          Etusivu
        </a>
      </li>

      <li>
        <a href="#" class="flex flex-col items-center gap-1 text-[11px] font-medium text-blue-600">
          <i class="fa-solid fa-plus text-xl"></i>
          Lisää oma
        </a>
      </li>

      <li>
        <a href="#" class="flex flex-col items-center gap-1 text-[11px] font-medium text-blue-600">
          <i class="fa-solid fa-bell text-xl"></i>
          Ilmoitukset
        </a>
      </li>

      <li>
        <a href="#" class="flex flex-col items-center gap-1 text-[11px] font-medium text-blue-600">
          <i class="fa-solid fa-user text-xl"></i>
          Oma käyttäjä
        </a>
      </li>

    </ul>
  </nav>



</body>

</html>
