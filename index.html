<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Myy ja Opi</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/src/style.css">
  <script src="main.js" defer></script>
</head>

<body class="w-screen flex flex-col items-center">

  <header class="
    flex flex-wrap justify-between items-center gap-8
    sticky top-0 z-10
    w-screen
    p-3
    text-white bg-blue-600 shadow-lg shadow-black-950/25
    ">

    <a class="flex items-center" id="website-title" href="index.html">
      Myy ja Opi
    </a>

    <nav class="flex flex-wrap items-center gap-2">

      <button class="flex flex-row items-center gap-2"><i class="fa-solid fa-sack-dollar"></i><span
          class="nav-label">Myy</span></button>
      <button class="flex flex-row items-center gap-2"><i class="fa-solid fa-cart-shopping"></i><span
          class="nav-label">Ostoskori</span></button>
      <button class="flex flex-row items-center gap-2"><i class="fa-solid fa-bell"></i><span
          class="nav-label">Ilmoitukset</span></button>

      <button class="
      flex items-center gap-2
      user-nav
      rounded-full
      ">
        <img class="rounded-full" id="user-avatar" alt="User avatar" src="../images/user-svgrepo-com.svg">
        <span id="user-name" class="nav-label">Anonyymi</span>
      </button>

    </nav>

  </header>

  <main class="grid gap-12 my-5">

    <form id="search-form" class="
    flex flex-col gap-3
    p-7
    rounded-3xl
    shadow-black-950/25
    ">

      <label for="item-search">
        <h2>Etsi</h2>
      </label>

      <div class="
      flex gap-5
      p-3
      rounded-full
      border border-solid border-grey-400
      focus-within:border-blue-600
      focus-within:shadow-xl/50">
        <input type="search" class="
        search-bar
        p-3
        border-none" id="item-search" name="item-search" placeholder="Etsi tuotteita...">
        <input type="submit" class="
        search-button
        px-6 py-3
        bg-blue-600 text-white
        rounded-full border-none
        hover:bg-blue-500
        active:bg-blue-700
        " value="Hae">
      </div>

      <label for="search-filters">
        <h3>Kategoriat</h3>
      </label>

      <div class="checkbox-group relative flex flex-wrap gap-2">

        <input type="checkbox" id="books" name="search-filters" value="books"><label for="books">Kirjat</label>
        <input type="checkbox" id="clothes" name="search-filters" value="clothes"><label for="clothes">Vaatteet</label>
        <input type="checkbox" id="electronics" name="search-filters" value="electronics"><label
          for="electronics">Elektroniikka</label>
        <input type="checkbox" id="badges" name="search-filters" value="badges"><label
          for="badges">Haalarimerkit</label>

      </div>
    </form>

    <section>

      <h2>Suosituimmat tuotteet</h2>

      <div class="product-row">

        <div class="product-card">
          <img src="../images/product.png" alt="" aria-hidden="true" class="product-img">
          <span class="product-name">Tuote 1</span>
        </div>

        <div class="product-card">
          <img src="../images/product.png" alt="" aria-hidden="true" class="product-img">
          <span class="product-name">Tuote 2</span>
        </div>

        <div class="product-card">
          <img src="../images/product.png" alt="" aria-hidden="true" class="product-img">
          <span class="product-name">Tuote 3</span>
        </div>

        <div class="product-card">
          <img src="images/product.png" alt="" aria-hidden="true" class="product-img">
          <span class="product-name">Tuote 4</span>
        </div>

        <div class="product-card">
          <img src="images/product.png" alt="" aria-hidden="true" class="product-img">
          <span class="product-name">Tuote 5</span>
        </div>

        <div class="product-card">
          <img src="images/product.png" alt="" aria-hidden="true" class="product-img">
          <span class="product-name">Tuote 6</span>
        </div>

      </div>

    </section>

  </main>

  <nav
    class="mobile-only fixed inset-x-0 bottom-0 z-20 border-t border-white/30 bg-white/30 pb-[env(safe-area-inset-bottom)] backdrop-blur-xl backdrop-saturate-150">
    <ul class="flex h-16 items-center justify-around">

      <li>
        <a href="#" class="flex flex-col items-center gap-1 text-xs font-medium text-blue-600">
          <i class="fa-solid fa-house text-2xl"></i>
          Etusivu
        </a>
      </li>

      <li>
        <a href="#" class="flex flex-col items-center gap-1 text-xs font-medium text-blue-600">
          <i class="fa-solid fa-plus text-2xl"></i>
          Lisää oma
        </a>
      </li>

      <li>
        <a href="#" class="flex flex-col items-center gap-1 text-xs font-medium text-blue-600">
          <i class="fa-solid fa-user text-2xl"></i>
          Oma käyttäjä
        </a>
      </li>

    </ul>
  </nav>


</body>

</html>
