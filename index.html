<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Myy ja Opi</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="style.css">
  <script src="main.js" defer></script>
</head>

<body>

  <header>

    <div class="website-title" id="header-left">
      Myy ja Opi
    </div>

    <div id="header-right">

      <div class="button-row">

        <button>Myy</button>
        <button>Ilmoitukset</button>
        <button>Viestit</button>

      </div>

      <button class="user-nav">
        <img class="user-avatar" alt="User avatar" src="images/user-svgrepo-com.svg">
        <span class="user-name">Anonyymi</span>
      </button>

    </div>

  </header>

  <main>

    <form id="search-form">

      <label for="item-search"><h2>Etsi</h2></label>

      <div>
        <input type="search" class="search-bar" id="item-search" name="item-search" placeholder="Etsi tuotteita...">
        <input type="submit" class="search-button" value="Hae">
      </div>

      <label for="search-filters"><h3>Kategoriat</h3></label>

      <div class="checkbox-group">

        <input type="checkbox" id="books" name="search-filters" value="books"><label for="books">Kirjat</label>
        <input type="checkbox" id="clothes" name="search-filters" value="clothes"><label for="clothes">Vaatteet</label>
        <input type="checkbox" id="electronics" name="search-filters" value="electronics"><label for="electronics">Elektroniikka</label>
        <input type="checkbox" id="badges" name="search-filters" value="badges"><label for="badges">Haalarimerkit</label>

      </div>
    </form>

    <section>

      <h2>Suosituimmat tuotteet</h2>

      <div class="product-row">

        <div class="product-card">
          <img src="images/product.png" alt="" aria-hidden="true" class="product-img">
          <span class="product-name">Tuote 1</span>
        </div>

        <div class="product-card">
          <img src="images/product.png" alt="" aria-hidden="true" class="product-img">
          <span class="product-name">Tuote 2</span>
        </div>

        <div class="product-card">
          <img src="images/product.png" alt="" aria-hidden="true" class="product-img">
          <span class="product-name">Tuote 3</span>
        </div>

        <div class="product-card">
          <img src="images/product.png" alt="" aria-hidden="true" class="product-img">
          <span class="product-name">Tuote 4</span>
        </div>

        <div class="product-card">
          <img src="images/product.png" alt="" aria-hidden="true" class="product-img">
          <span class="product-name">Tuote 5</span>
        </div>

        <div class="product-card">
          <img src="images/product.png" alt="" aria-hidden="true" class="product-img">
          <span class="product-name">Tuote 6</span>
        </div>

      </div>

    </section>

  </main>

  <nav class="fixed inset-x-0 bottom-0 z-20 border-t border-white/30 bg-white/30 pb-[env(safe-area-inset-bottom)] backdrop-blur-xl backdrop-saturate-150 md:hidden">
  <ul class="flex h-16 items-center justify-around">

    <li>
      <a href="#" class="flex flex-col items-center gap-1 text-xs font-medium text-blue-600">
        <i class="fa-solid fa-house text-2xl"></i>
        Etusivu
      </a>
    </li>

    <li>
      <a href="#" class="flex flex-col items-center gap-1 text-xs font-medium text-blue-600">
        <i class="fa-solid fa-plus text-2xl"></i>
        Lisää oma
      </a>
    </li>

    <li>
      <a href="#" class="flex flex-col items-center gap-1 text-xs font-medium text-blue-600">
        <i class="fa-solid fa-user text-2xl"></i>
        Oma käyttäjä
      </a>
    </li>

  </ul>
</nav>


</body>

</html>
